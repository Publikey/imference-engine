[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imference-engine"
version = "0.4.1"
description = "Unified Diffusers-based inference engine: SDXL, SD 1.5, Z-Image, FLUX, Chroma, Qwen-Image, Anima, and Wan video behind one API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Publikey" }]

# Runtime deps. PyTorch and diffusers are required for any real use; they're
# listed under [optional-dependencies].runtime so the package itself can be
# imported and unit-tested without pulling 5GB of wheels on dev machines that
# only need the pure-Python pieces (BatchSizer, catalog loader, etc.).
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
# Real inference. Install with: pip install -e ".[runtime,dev]"
# Note: install the GPU-enabled torch separately first (extras only pin
# torch>=2.6, so pip would otherwise pull the CPU wheel):
#   NVIDIA:      pip install torch --index-url https://download.pytorch.org/whl/cu124
#   AMD (Linux): pip install torch --index-url https://download.pytorch.org/whl/rocm6.4
#   AMD (Windows, preview): Python 3.12 wheels from repo.radeon.com
# ROCm torch presents the GPU as "cuda" (torch.version.hip set), so the engine
# runs on AMD without configuration changes — see imference_engine/runtime/device.py.
#
# sd-embed (weighted prompt embeddings + BREAK keyword) is GitHub-only and
# its setup.py declares unconstrained torch + torchvision deps that would
# clobber an existing CUDA torch with the CPU wheel. INTENTIONALLY NOT in
# this extras list — install it with --no-deps separately:
#   pip install --no-deps "sd-embed @ https://github.com/xhinker/sd_embed/archive/refs/heads/main.tar.gz"
# The engine falls back to raw prompts if sd-embed is missing.
#
# ML versions are pinned to the gen-image-worker prod combo. Tightly coupled:
# diffusers+transformers+accelerate+peft must be upgraded together with care
# (single_file loaders, CLIP layouts, and LoRA hooks all shift between minors).
# diffusers is on 0.40.0 EVERYWHERE — image, wan AND minimax-h3 now share one
# diffusers (0.40.0 ships H3's PR #14355, so H3's dedicated-venv era is over).
# ⚠️ VALIDATION STATUS: all 7 image backends AND Wan were validated e2e on
# 0.39 (RTX PRO 5000 Blackwell, torch 2.12); the 0.39 -> 0.40 fold is NOT yet
# re-validated — run validation/validate.py + validate_wan.py +
# validate_h3.py before tagging/shipping. 0.40 changes to watch: mixed-rank
# LoRA scaling without alpha keys now loads at intended scale (check the LoRA
# hooks), torch_dtype is deprecated for dtype (engine code already migrated),
# Flax removed (unused here), DDUF deprecated (unused here).
#
# Per-backend extras: each image backend has its own named runtime, mirroring
# [wan]. NOTE: [sdxl] and [zimage] are byte-for-byte IDENTICAL — Z-Image rides
# the same diffusers 0.40 / transformers stack as SDXL in one Engine (its Qwen
# text encoder needs no wheel SDXL lacks). The split is a packaging boundary /
# naming symmetry, not a real dependency fork (unlike [wan], which genuinely
# adds gguf/imageio). Only the runtime KNOBS differ: use_tiny_vae is SDXL-only.
#
# protobuf backs transformers' slow→fast sentencepiece tokenizer conversion.
# It is REQUIRED whenever a base repo ships only spiece.model with no
# tokenizer.json (Chroma1-HD does); without it transformers 5.1 falls back to
# a tiktoken extractor that cannot parse the file. A clean venv from these
# extras only ever worked for Chroma when protobuf happened to be present
# transitively — caught on a clean pod during the 0.40 validation (2026-08-26).
#
# peft is 0.19.1 (bumped from the 0.18.1 prod combo during the 0.40
# validation): peft 0.18.1's LoRA torchao dispatcher imports
# LinearActivationQuantizedTensor, which torchao 0.18 removed — so ANY
# load_lora_weights crashes the moment torchao is importable in the venv.
# Invisible before the 0.40 fold (H3's torchao lived in a separate venv);
# fatal now that [wan] + [minimax-h3] share one venv (Wan's Lightning LoRA is
# the exposed surface). 0.19.1 dispatches via torchao.utils.TorchAOBaseTensor
# (the v2 API) and coexists with torchao 0.18.
sdxl = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
zimage = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# SD 1.5 — same diffusers 0.40 stack as SDXL (single CLIP-L encoder, no extra
# wheel). Byte-for-byte identical to [sdxl]; split for naming symmetry only.
sd15 = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# FLUX.1 (Black Forest Labs) — same diffusers 0.40 / transformers stack as SDXL
# and Z-Image (its CLIP-L + T5-XXL text encoders need no wheel those lack;
# sentencepiece, already present, backs the T5 tokenizer). Byte-for-byte
# identical to [zimage] — the split is a packaging boundary / naming symmetry,
# not a real dependency fork. The 12B transformer is heavy: run with
# RuntimeConfig(enable_offload=True) on consumer VRAM.
flux = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Chroma — FLUX-derived, single T5 encoder. Same stack as [flux]/[zimage].
chroma = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Qwen-Image — 20B MMDiT with a Qwen2.5-VL text encoder. Same diffusers 0.40
# stack; the VL encoder needs no wheel the others lack (transformers>=5.4 already
# ships it). Very heavy — pair with cpu-offload / a quantized build.
qwenimage = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Anima — Modular Diffusers pipeline (Cosmos DiT + Qwen3 encoder). Needs the same
# diffusers 0.40 stack (AnimaModularPipeline landed in 0.39.0) + transformers>=5.4
# for Qwen3. Modular-only; see imference_engine/anima/README.md.
anima = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Krea 2 (Turbo) — 12.9B single-stream flow-matching DiT with a Qwen3-VL-4B
# text encoder + the Qwen-Image VAE. Same diffusers 0.40 stack (Krea2Pipeline
# landed in 0.39); transformers 5.4 already ships Qwen3-VL. The civitai/ComfyUI
# single-file + scaled-fp8 loading is engine-side (krea2/convert.py) — no extra
# wheel needed. Byte-for-byte identical to the other image extras.
krea2 = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate==1.12.0",
    "peft==0.19.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Deprecated back-compat alias (workers/CI referencing [runtime]). Equals the
# union of the per-backend image extras. Prefer the specific extra.
runtime = ["imference-engine[sdxl,sd15,zimage,flux,chroma,qwenimage,anima,krea2]"]
azure = ["azure-storage-blob>=12"]
# R2 / S3-compatible CDN staging (validation/stage_r2.py — upload base components
# to the mirror). boto3 talks to Cloudflare R2's S3 API.
stage = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-mock", "ruff"]

# Wan2.2 video stack (diffusers + gguf). Shares the same diffusers pin as
# [runtime] (both 0.40.0) — the repo keeps ONE diffusers across image + video,
# so this moved with the 0.39->0.40 fold too. Wan was re-validated e2e on 0.39
# (validation/README.md); re-validate on 0.40 with validate_wan.py like the
# image engines. Kept a SEPARATE extra only for
# the extra gguf/imageio video deps. Install: pip install "imference-engine[wan]".
# torch>=2.6 is required (the FA3 custom op breaks the import on torch 2.4);
# install the CUDA (cu124) or ROCm (rocm6.4) build from your base image — the
# op registration is torch-version-gated, not vendor-gated.
wan = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers>=5.4",
    "accelerate>=1.12",
    "peft>=0.19.1",
    "gguf>=0.10",
    "ftfy>=6.3",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "requests>=2.31",
]

# MiniMax-H3 joint video+audio stack (33B DiT + Qwen3-VL-32B conditioner,
# torchao int8). H3's diffusers integration (PR #14355) SHIPPED in diffusers
# 0.40.0 — the SAME pin as every other extra now, so H3 no longer needs a
# dedicated venv (it spent its pre-release life on a PR-head install that
# conflicted with the old repo-wide 0.39.0 pin). H3 was validated e2e on the
# PR head that became 0.40.0 (2026-08-05); re-run validation/validate_h3.py
# on the release pin before shipping. Released 0.40.0 dropped the PR head's
# torch.nn.functional.ScalingType import, so torch>=2.6 is honest again
# (prod stays on the validated 2.11+/cu128 combo).
minimax-h3 = [
    "torch>=2.6",
    "diffusers==0.40.0",
    # transformers floor 5.3: released 0.40.0's H3 text-encoder step calls
    # Qwen3VLProcessor.create_mm_token_type_ids and passes mm_token_type_ids
    # into the Qwen3-VL forward — the processor method lands in 5.2.0 but the
    # MODEL only accepts the kwarg from 5.3.0 (the PR head validated 2026-08-05
    # did neither). The image extras pin ==5.4.0 (the stack-validated combo).
    "transformers>=5.3",
    "accelerate>=1.12",
    # torchao floor: 0.18 is what serialized the R2 int8 mirror tree AND the
    # version whose v2 API peft 0.19.1's LoRA dispatcher expects (see the peft
    # note above the image extras).
    "torchao>=0.18",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["imference_engine*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
