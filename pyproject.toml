[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imference-engine"
version = "0.7.0"
description = "Unified Diffusers-based inference engine: SDXL, SD 1.5, Z-Image, FLUX, Chroma, Qwen-Image, Anima, and Wan video behind one API."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Publikey" }]

# Runtime deps. PyTorch and diffusers are required for any real use; they're
# listed under [optional-dependencies].runtime so the package itself can be
# imported and unit-tested without pulling 5GB of wheels on dev machines that
# only need the pure-Python pieces (BatchSizer, catalog loader, etc.).
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
# Real inference. Install with: pip install -e ".[runtime,dev]"
# Note: install the GPU-enabled torch separately first (extras only pin
# torch>=2.6, so pip would otherwise pull the CPU wheel):
#   NVIDIA:      pip install torch --index-url https://download.pytorch.org/whl/cu124
#   AMD (Linux): pip install torch --index-url https://download.pytorch.org/whl/rocm6.4
#   AMD (Windows, preview): Python 3.12 wheels from repo.radeon.com
# ROCm torch presents the GPU as "cuda" (torch.version.hip set), so the engine
# runs on AMD without configuration changes — see imference_engine/runtime/device.py.
#
# sd-embed (weighted prompt embeddings + BREAK keyword) is GitHub-only and
# its setup.py declares unconstrained torch + torchvision deps that would
# clobber an existing CUDA torch with the CPU wheel. INTENTIONALLY NOT in
# this extras list — install it with --no-deps separately:
#   pip install --no-deps "sd-embed @ https://github.com/xhinker/sd_embed/archive/refs/heads/main.tar.gz"
# The engine falls back to raw prompts if sd-embed is missing.
#
# ML versions are pinned to the gen-image-worker prod combo. Tightly coupled:
# diffusers+transformers+accelerate+peft must be upgraded together with care
# (single_file loaders, CLIP layouts, and LoRA hooks all shift between minors).
# diffusers is on 0.43.0 EVERYWHERE — image, wan AND minimax-h3 share one
# diffusers, and EVERY extra pins the same transformers / accelerate / peft
# (the video extras only set floors before 2026-11-19: a worker built on a
# given day got whatever was newest).
# Validated 2026-11-18/19 against the previous 0.40.0 / 5.4.0 / 0.19.1 / 1.12.0
# stack, same seeds, weights from the CDN (validation/README.md):
#   - image (SDXL, Z-Image, Krea 2, Anima, FLUX.2 klein, ERNIE, Qwen-Image
#     2512 / Layered / Edit, LongCat, + LoRAs): pixel-identical, same timings.
#   - Lumina 2: identical once Gemma 2 is loaded with eager attention
#     (transformers 5.4 picked SDPA, which skips the logit soft-capping).
#   - Wan t2v / i2v and MiniMax-H3 t2v / i2v: pass. Wan output follows the
#     transformers version (5.4.0 vs 5.22.2), not diffusers / peft / accelerate.
#   - NOT run on this stack: SD 1.5, FLUX.1, Chroma, Qwen-Image bf16 (no
#     checkpoint on the CDN).
# Python >= 3.11 (diffusers 0.42 dropped 3.10). diffusers 0.42.1 carries a
# security fix for component resolution in from_pretrained.
# transformers 5.4.0 must NOT come back: its Qwen3-VL vision tower fails under
# leaf offload (H3 image-to-video: "tensors on cuda:0 and cpu").
#
# peft: 0.18.1's LoRA torchao dispatcher imports
# LinearActivationQuantizedTensor, which torchao 0.18 removed — any
# load_lora_weights crashes the moment torchao is importable in the venv.
# Stay >= 0.19.1 (dispatch via torchao.utils.TorchAOBaseTensor, the v2 API).
sdxl = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
zimage = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# SD 1.5 — same diffusers 0.40 stack as SDXL (single CLIP-L encoder, no extra
# wheel). Byte-for-byte identical to [sdxl]; split for naming symmetry only.
sd15 = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# FLUX.1 (Black Forest Labs) — same diffusers 0.40 / transformers stack as SDXL
# and Z-Image (its CLIP-L + T5-XXL text encoders need no wheel those lack;
# sentencepiece, already present, backs the T5 tokenizer). Byte-for-byte
# identical to [zimage] — the split is a packaging boundary / naming symmetry,
# not a real dependency fork. The 12B transformer is heavy: run with
# RuntimeConfig(enable_offload=True) on consumer VRAM.
flux = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Chroma — FLUX-derived, single T5 encoder. Same stack as [flux]/[zimage].
chroma = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Qwen-Image — 20B MMDiT with a Qwen2.5-VL text encoder. Same diffusers 0.40
# stack; the VL encoder needs no wheel the others lack (transformers>=5.4 already
# ships it). Very heavy — pair with cpu-offload / a quantized build.
qwenimage = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Qwen-Image-Edit, GGUF lite build (Desktop + cloud): GGUF transformer +
# NF4 encoder (bitsandbytes; CUDA only — elsewhere the encoder stays bf16).
qwenimage-edit = [
    "imference-engine[qwenimage]",
    "gguf>=0.10",
    "bitsandbytes>=0.45; platform_system != 'Darwin'",
]
# Anima — Modular Diffusers pipeline (Cosmos DiT + Qwen3 encoder). Needs the same
# diffusers 0.40 stack (AnimaModularPipeline landed in 0.39.0) + transformers>=5.4
# for Qwen3. Modular-only; see imference_engine/anima/README.md.
anima = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Krea 2 (Turbo) — 12.9B single-stream flow-matching DiT with a Qwen3-VL-4B
# text encoder + the Qwen-Image VAE. Same diffusers 0.40 stack (Krea2Pipeline
# landed in 0.39); transformers 5.4 already ships Qwen3-VL. The civitai/ComfyUI
# single-file + scaled-fp8 loading is engine-side (krea2/convert.py) — no extra
# wheel needed. Byte-for-byte identical to the other image extras.
krea2 = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# FLUX.2 [klein] 4B — 3.9B rectified-flow DiT + Qwen3-4B text encoder + the
# FLUX.2 VAE (Flux2KleinPipeline, in diffusers since 0.37). Same diffusers 0.40
# stack; the scaled-fp8 single file is dequantized engine-side
# (flux2klein/convert.py). gguf backs the unsloth GGUF builds (Q8/Q5/Q4) — the
# only wheel the other image extras lack.
flux2-klein = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "gguf>=0.10",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# ERNIE-Image (Baidu) — 8B single-stream flow DiT + Ministral-3-3B text encoder
# + the FLUX.2 VAE (ErnieImagePipeline, diffusers 0.40). Same stack; gguf backs
# the unsloth GGUF builds, which are the practical way to run it under 32 GB.
ernie-image = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "gguf>=0.10",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Lumina-Image 2.0 (Alpha-VLLM) — 2.6B flow DiT + Gemma-2-2b text encoder + the
# FLUX.1 VAE (Lumina2Pipeline). Same stack; gguf backs the community GGUF builds.
lumina2 = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "gguf>=0.10",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# LongCat-Image (Meituan) — 6B flow DiT + Qwen2.5-VL-7B encoder + FLUX VAE
# (LongCatImagePipeline / LongCatImageEditPipeline). Same stack, no extra wheel:
# the low-memory builds are fp8 storage of the bf16 repo weights.
longcat = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Deprecated back-compat alias (workers/CI referencing [runtime]). Equals the
# union of the per-backend image extras. Prefer the specific extra.
runtime = ["imference-engine[sdxl,sd15,zimage,flux,chroma,qwenimage,anima,krea2,flux2-klein,ernie-image,lumina2,longcat]"]
azure = ["azure-storage-blob>=12"]
# Editing tools (imference_engine.tools): Pillow utilities + the ONNX light
# models (upscale, background removal, eraser, click-select, faces, RIFE).
# CPU onnxruntime by default; GPU hosts swap in onnxruntime-gpu (CUDA) or
# onnxruntime-directml (Windows) — same API, picked up automatically.
# imageio-ffmpeg bundles an ffmpeg binary for the video utilities when the
# host has none on PATH. No torch needed.
tools = [
    "Pillow>=10",
    "numpy",
    "onnxruntime>=1.18",
    "imageio-ffmpeg>=0.5",
]
# Describe (Florence-2) runs through transformers: tools + torch.
tools-torch = [
    "imference-engine[tools]",
    "torch>=2.6",
    "transformers>=4.56",
]
# R2 / S3-compatible CDN staging (validation/stage_r2.py — upload base components
# to the mirror). boto3 talks to Cloudflare R2's S3 API.
stage = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-mock", "ruff"]

# Wan2.2 video stack (diffusers + gguf). Shares the same diffusers pin as
# [runtime] — the repo keeps ONE diffusers across image + video, and the same
# transformers / accelerate / peft pins. Kept a SEPARATE extra only for
# the extra gguf/imageio video deps. Install: pip install "imference-engine[wan]".
# torch>=2.6 is required (the FA3 custom op breaks the import on torch 2.4);
# install the CUDA (cu124) or ROCm (rocm6.4) build from your base image — the
# op registration is torch-version-gated, not vendor-gated.
wan = [
    "torch>=2.6",
    "diffusers==0.43.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "gguf>=0.10",
    "ftfy>=6.3",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "requests>=2.31",
]

# MiniMax-H3 joint video+audio stack (33B DiT + Qwen3-VL-32B conditioner,
# torchao int8). H3's diffusers integration (PR #14355) SHIPPED in diffusers
# 0.40.0 and it shares the repo-wide pins with every other extra. Validated
# on 0.43.0 / transformers 5.22.2 / torch 2.11 cu128 (2026-11-19, int8 CDN
# mirror, block offload); prod stays on the 2.11+/cu128 torch.
minimax-h3 = [
    "torch>=2.6",
    "diffusers==0.43.0",
    # transformers floor 5.3: released 0.40.0's H3 text-encoder step calls
    # Qwen3VLProcessor.create_mm_token_type_ids and passes mm_token_type_ids
    # into the Qwen3-VL forward — the processor method lands in 5.2.0 but the
    # MODEL only accepts the kwarg from 5.3.0 (the PR head validated 2026-08-05
    # did neither). Pinned like the image extras.
    "transformers==5.22.2",
    "accelerate==1.15.0",
    # torchao floor: 0.18 is what serialized the R2 int8 mirror tree AND the
    # version whose v2 API peft 0.19.1's LoRA dispatcher expects (see the peft
    # note above the image extras).
    "torchao>=0.18",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]

[tool.setuptools.package-data]
"imference_engine.tools" = ["manifests/*.json"]

[tool.setuptools.packages.find]
include = ["imference_engine*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
