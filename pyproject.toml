[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imference-engine"
version = "0.3.2"
description = "Unified Diffusers-based inference engine: SDXL, SD 1.5, Z-Image, FLUX, Chroma, Qwen-Image, Anima, and Wan video behind one API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Publikey" }]

# Runtime deps. PyTorch and diffusers are required for any real use; they're
# listed under [optional-dependencies].runtime so the package itself can be
# imported and unit-tested without pulling 5GB of wheels on dev machines that
# only need the pure-Python pieces (BatchSizer, catalog loader, etc.).
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
# Real inference. Install with: pip install -e ".[runtime,dev]"
# Note: install the GPU-enabled torch separately first (extras only pin
# torch>=2.6, so pip would otherwise pull the CPU wheel):
#   NVIDIA:      pip install torch --index-url https://download.pytorch.org/whl/cu124
#   AMD (Linux): pip install torch --index-url https://download.pytorch.org/whl/rocm6.4
#   AMD (Windows, preview): Python 3.12 wheels from repo.radeon.com
# ROCm torch presents the GPU as "cuda" (torch.version.hip set), so the engine
# runs on AMD without configuration changes — see imference_engine/runtime/device.py.
#
# sd-embed (weighted prompt embeddings + BREAK keyword) is GitHub-only and
# its setup.py declares unconstrained torch + torchvision deps that would
# clobber an existing CUDA torch with the CPU wheel. INTENTIONALLY NOT in
# this extras list — install it with --no-deps separately:
#   pip install --no-deps "sd-embed @ https://github.com/xhinker/sd_embed/archive/refs/heads/main.tar.gz"
# The engine falls back to raw prompts if sd-embed is missing.
#
# ML versions are pinned to the gen-image-worker prod combo. Tightly coupled:
# diffusers+transformers+accelerate+peft must be upgraded together with care
# (single_file loaders, CLIP layouts, and LoRA hooks all shift between minors).
# diffusers is on 0.39.0 — the SAME version the [wan] extra uses, so the image
# and video stacks share one diffusers. All 7 image backends (sdxl, sd15, zimage,
# flux, chroma, qwenimage, anima) are VALIDATED end-to-end on 0.39 (RTX PRO 5000
# Blackwell, torch 2.12) via validation/. Wan was validated on 0.38 and still
# wants a re-check on 0.39.
#
# Per-backend extras: each image backend has its own named runtime, mirroring
# [wan]. NOTE: [sdxl] and [zimage] are byte-for-byte IDENTICAL — Z-Image rides
# the same diffusers 0.39 / transformers stack as SDXL in one Engine (its Qwen
# text encoder needs no wheel SDXL lacks). The split is a packaging boundary /
# naming symmetry, not a real dependency fork (unlike [wan], which genuinely
# adds gguf/imageio). Only the runtime KNOBS differ: use_tiny_vae is SDXL-only.
sdxl = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers==5.1.0",
    "accelerate==1.12.0",
    "peft==0.18.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
zimage = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers==5.1.0",
    "accelerate==1.12.0",
    "peft==0.18.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# SD 1.5 — same diffusers 0.39 stack as SDXL (single CLIP-L encoder, no extra
# wheel). Byte-for-byte identical to [sdxl]; split for naming symmetry only.
sd15 = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers==5.1.0",
    "accelerate==1.12.0",
    "peft==0.18.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# FLUX.1 (Black Forest Labs) — same diffusers 0.39 / transformers stack as SDXL
# and Z-Image (its CLIP-L + T5-XXL text encoders need no wheel those lack;
# sentencepiece, already present, backs the T5 tokenizer). Byte-for-byte
# identical to [zimage] — the split is a packaging boundary / naming symmetry,
# not a real dependency fork. The 12B transformer is heavy: run with
# RuntimeConfig(enable_offload=True) on consumer VRAM.
flux = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers==5.1.0",
    "accelerate==1.12.0",
    "peft==0.18.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Chroma — FLUX-derived, single T5 encoder. Same stack as [flux]/[zimage].
chroma = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers==5.1.0",
    "accelerate==1.12.0",
    "peft==0.18.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Qwen-Image — 20B MMDiT with a Qwen2.5-VL text encoder. Same diffusers 0.39
# stack; the VL encoder needs no wheel the others lack (transformers>=5.1 already
# ships it). Very heavy — pair with cpu-offload / a quantized build.
qwenimage = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers==5.1.0",
    "accelerate==1.12.0",
    "peft==0.18.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Anima — Modular Diffusers pipeline (Cosmos DiT + Qwen3 encoder). Needs the same
# diffusers 0.39 stack (AnimaModularPipeline landed in 0.39.0) + transformers>=5.1
# for Qwen3. Modular-only; see imference_engine/anima/README.md.
anima = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers==5.1.0",
    "accelerate==1.12.0",
    "peft==0.18.1",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]
# Deprecated back-compat alias (workers/CI referencing [runtime]). Equals the
# union of the per-backend image extras. Prefer the specific extra.
runtime = ["imference-engine[sdxl,sd15,zimage,flux,chroma,qwenimage,anima]"]
azure = ["azure-storage-blob>=12"]
# R2 / S3-compatible CDN staging (validation/stage_r2.py — upload base components
# to the mirror). boto3 talks to Cloudflare R2's S3 API.
stage = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-mock", "ruff"]

# Wan2.2 video stack (diffusers + gguf). Shares the same diffusers pin as
# [runtime] (both 0.39.0) — the repo keeps ONE diffusers across image + video, so
# this moved with the blind 0.38->0.39 bump too. NOTE: Wan was validated on 0.38;
# re-validate it on 0.39 like the image engines. Kept a SEPARATE extra only for
# the extra gguf/imageio video deps. Install: pip install "imference-engine[wan]".
# torch>=2.6 is required (the FA3 custom op breaks the import on torch 2.4);
# install the CUDA (cu124) or ROCm (rocm6.4) build from your base image — the
# op registration is torch-version-gated, not vendor-gated.
wan = [
    "torch>=2.6",
    "diffusers==0.39.0",
    "transformers>=5.1",
    "accelerate>=1.12",
    "peft>=0.18",
    "gguf>=0.10",
    "ftfy>=6.3",
    "sentencepiece>=0.2",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "requests>=2.31",
]

# MiniMax-H3 joint video+audio stack (33B DiT + Qwen3-VL-32B conditioner,
# torchao int8). diffusers is DELIBERATELY ABSENT from this extra: H3 needs
# diffusers PR #14355, which no release carries yet — it CANNOT satisfy the
# repo-wide ==0.39.0 pin, so until the PR ships in a release this extra must
# live in a DEDICATED venv/process with:
#   pip install git+https://github.com/huggingface/diffusers.git@refs/pull/14355/head
# When the PR is released: pin that diffusers here, re-validate, and (if the
# release also passes the image suite) fold it into the repo-wide pin.
minimax-h3 = [
    "torch>=2.6",
    "transformers>=5.1",
    "accelerate>=1.12",
    "torchao>=0.10",
    "safetensors>=0.4",
    "Pillow>=10",
    "numpy",
    "huggingface_hub>=0.24",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["imference_engine*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
