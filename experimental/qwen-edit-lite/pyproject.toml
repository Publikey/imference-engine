[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-edit-lite"
version = "0.1.0"
description = "Standalone low-VRAM / low-RAM Qwen-Image-Edit-2511 runner and benchmark (GGUF, Lightning, NF4 encoder, offload)."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "diffusers==0.40.0",
    "transformers==5.4.0",
    "accelerate>=1.12",
    "peft>=0.19.1",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "Pillow>=10",
    "numpy",
    "psutil>=5.9",
    "PyYAML>=6",
]

[project.optional-dependencies]
gguf = ["gguf>=0.10"]
nf4 = ["bitsandbytes>=0.45"]
torchao = ["torchao>=0.18"]
quality = ["lpips>=0.1.4"]
all = ["gguf>=0.10", "bitsandbytes>=0.45", "torchao>=0.18", "lpips>=0.1.4"]
dev = ["pytest>=8"]

[project.scripts]
qwen-edit-lite = "qwen_edit_lite.cli:main"

[tool.setuptools.packages.find]
include = ["qwen_edit_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
