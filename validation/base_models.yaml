# Base model per engine — the validation harness (validation/validate.py) uses
# this to load each backend's canonical base model on a GPU instance, generate a
# render, and report pass/fail. Edit freely: point `weights_local` at files you
# already have, or fix a `filename` / `repo` that differs from your setup.
#
# Each top-level key IS the backend/engine name (matches Engine._backends).
#
# Fields per engine:
#   mode         : single_file | repo
#                    single_file -> download `filename` from `repo` (hf_hub_download)
#                                   and register that .safetensors as weights_path
#                    repo        -> pass `repo` (a diffusers-format repo id/dir)
#                                   directly as weights_path (Anima / ModularPipeline)
#   repo         : HuggingFace repo id
#   filename     : single-file weight to download (single_file mode only)
#   base_model   : shared-component repo for transformer-only checkpoints (or null)
#   weights_local: OPTIONAL local path override — bypasses download entirely
#   offload      : enable_model_cpu_offload (set true for the 8-20B models)
#   prompt / negative_prompt / width / height / num_steps / guidance_scale / seed
#   backend_options: engine-specific (e.g. Z-Image shift)
#   source_image : edit-only engines (qwenimage-edit) — a local image path, or
#                  `synthetic` for a built-in test scene (red ball on grass)
#
# STATUS: all 7 entries validated end-to-end on diffusers 0.39 (pins now on
# 0.40.0 — re-run validate.py before releasing) (RTX PRO 5000
# Blackwell, torch 2.12) — each renders from its base model. Gated repos
# (FLUX.1-dev) need `hf auth login` + an HF_TOKEN with gated-repo read access.

sdxl:
  mode: single_file
  repo: stabilityai/stable-diffusion-xl-base-1.0
  filename: sd_xl_base_1.0.safetensors
  base_model: null
  offload: false
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus, 85mm"
  negative_prompt: "lowres, blurry, deformed, watermark"
  width: 1024
  height: 1024
  num_steps: 28
  guidance_scale: 6.5
  seed: 42

sd15:
  mode: single_file
  repo: stable-diffusion-v1-5/stable-diffusion-v1-5
  filename: v1-5-pruned-emaonly.safetensors
  base_model: null
  offload: false
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus"
  negative_prompt: "lowres, blurry, deformed, watermark"
  width: 512
  height: 512
  num_steps: 25
  guidance_scale: 7.0
  seed: 42

zimage:
  mode: single_file
  # Comfy-Org ships the transformer-only single file (split_files/diffusion_models);
  # the base_model repo supplies the Qwen text_encoder + VAE + tokenizer.
  repo: Comfy-Org/z_image_turbo
  filename: split_files/diffusion_models/z_image_turbo_bf16.safetensors
  base_model: Tongyi-MAI/Z-Image-Turbo
  offload: false
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus"
  negative_prompt: "lowres, blurry"
  width: 1024
  height: 1024
  num_steps: 8
  guidance_scale: 1.0
  backend_options: {shift: 3.0}
  seed: 42

flux:
  mode: single_file
  repo: black-forest-labs/FLUX.1-dev      # GATED — huggingface-cli login first
  filename: flux1-dev.safetensors
  base_model: black-forest-labs/FLUX.1-dev
  offload: true
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus, 85mm"
  width: 1024
  height: 1024
  num_steps: 28
  guidance_scale: 3.5
  seed: 42

chroma:
  mode: single_file
  repo: lodestones/Chroma1-HD
  filename: Chroma1-HD.safetensors
  base_model: lodestones/Chroma1-HD
  offload: true
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus"
  negative_prompt: "lowres, blurry, deformed"
  width: 1024
  height: 1024
  num_steps: 28
  guidance_scale: 2.0   # validated: higher oversaturates
  seed: 42

qwenimage:
  mode: single_file
  # Comfy-Org transformer-only single file (40.9 GB bf16); base_model supplies the
  # Qwen2.5-VL text encoder + VAE + tokenizer. Heavy — offload + patience.
  repo: Comfy-Org/Qwen-Image_ComfyUI
  filename: split_files/diffusion_models/qwen_image_bf16.safetensors
  base_model: Qwen/Qwen-Image
  offload: true
  prompt: 'a bookstore window with a sign that reads "Imference Engine"'
  negative_prompt: " "
  width: 1024
  height: 1024
  num_steps: 40
  guidance_scale: 4.0
  seed: 42

qwenimage-edit:
  # Instruction editing — no text-to-image mode, so the harness feeds a source
  # image. Repo mode pulls the official diffusers repo (~58 GB; or point
  # weights_local at a transformer-only .safetensors + base_model). NOT yet
  # validated on GPU.
  mode: repo
  repo: Qwen/Qwen-Image-Edit-2511
  filename: null
  base_model: null
  offload: true
  source_image: synthetic
  prompt: "make the red ball blue, keep everything else unchanged"
  negative_prompt: " "
  width: 1024
  height: 1024
  num_steps: 40
  guidance_scale: 4.0
  seed: 42

krea2:
  mode: single_file
  # Comfy-Org repackage of the official Krea 2 Turbo — the fp8_scaled file is
  # exactly what the civitai finetune ecosystem ships (native keys + scaled
  # fp8), i.e. the load path this backend exists for (~12.2 GB, ungated).
  # base_model supplies the Qwen3-VL-4B encoder + Qwen-Image VAE + tokenizer +
  # scheduler (GATED — accept the Krea 2 Community License / `hf auth login`).
  repo: Comfy-Org/Krea-2
  filename: diffusion_models/krea2_turbo_fp8_scaled.safetensors
  base_model: krea/Krea-2-Turbo
  offload: true
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus"
  width: 1024
  height: 1024
  num_steps: 8            # Turbo recipe (TDM-distilled)
  guidance_scale: 0.0     # Krea convention: 0 = guidance off (the Turbo norm)
  seed: 42

flux2-klein:
  mode: single_file
  # BFL's own transformer-only single file (native keys, bf16, 7.75 GB,
  # Apache-2.0, ungated). base_model supplies the Qwen3-4B encoder + FLUX.2 VAE +
  # tokenizer + scheduler AND the transformer config (diffusers 0.40's
  # single-file detection only knows FLUX.2 [dev]). Swap `repo`/`filename` for
  # black-forest-labs/FLUX.2-klein-4b-fp8 / flux-2-klein-4b-fp8.safetensors or an
  # unsloth/FLUX.2-klein-4B-GGUF file to validate the quantized builds.
  repo: black-forest-labs/FLUX.2-klein-4B
  filename: flux-2-klein-4b.safetensors
  base_model: black-forest-labs/FLUX.2-klein-4B
  offload: false
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus, 85mm"
  width: 1024
  height: 1024
  num_steps: 4            # step-distilled
  guidance_scale: 1.0     # distilled: guidance is fixed, no negative prompt
  seed: 42

ernie-image:
  mode: single_file
  # unsloth GGUF Q8_0 of the Turbo transformer (8.7 GB, Apache-2.0): bf16 is
  # 16 GB and does not fit a 24 GB card next to the 7.7 GB encoder. base_model
  # supplies the Ministral-3-3B encoder + FLUX.2 VAE + tokenizer + scheduler and
  # the transformer config. Text-to-image only.
  repo: unsloth/ERNIE-Image-Turbo-GGUF
  filename: ernie-image-turbo-Q8_0.gguf
  base_model: baidu/ERNIE-Image-Turbo
  offload: false
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus, 85mm"
  width: 1024
  height: 1024
  num_steps: 8            # Turbo (DMD-distilled)
  guidance_scale: 1.0     # no CFG on Turbo
  seed: 42

lumina2:
  mode: single_file
  # Comfy-Org bf16 repackage of the OFFICIAL checkpoint (consolidated.pth) — the
  # weights the ComfyUI ecosystem and the anime finetunes (Neta / NetaYume) build
  # on. NOTE: the `transformer/` folder of Alpha-VLLM/Lumina-Image-2.0 holds
  # DIFFERENT weights (every tensor differs from consolidated.pth), so this file
  # is the reference, not the repo's diffusers transformer. base_model supplies
  # the Gemma-2-2b encoder + FLUX.1 VAE + tokenizer + scheduler + config.
  repo: Comfy-Org/Lumina_Image_2.0_Repackaged
  filename: split_files/diffusion_models/lumina_2_model_bf16.safetensors
  base_model: Alpha-VLLM/Lumina-Image-2.0
  offload: false
  prompt: "a photo of a red fox in a snowy forest, golden hour, sharp focus, 85mm"
  negative_prompt: "blurry, low quality, deformed"
  width: 1024
  height: 1024
  num_steps: 30           # undistilled, true CFG (2 passes per step)
  guidance_scale: 4.0
  seed: 42

anima:
  mode: repo
  repo: circlestone-labs/Anima-Base-v1.0-Diffusers
  filename: null
  base_model: null
  offload: false
  prompt: "masterpiece, best quality, 1girl, solo, city lights"
  width: 1024
  height: 1024
  num_steps: 28
  guidance_scale: 6.0
  seed: 42
